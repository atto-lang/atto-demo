# A passing job validates the inventory only; guest execution is not performed.
name: Semantic coverage index (source-only)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --quiet
          git diff --cached --quiet
      - name: Check shell syntax
        run: |
          bash -n ci/check-semantic-coverage.sh
          bash -n ci/test-semantic-coverage.sh
      - name: Adversarial catalog tests
        run: bash ci/test-semantic-coverage.sh
      - name: Validate complete semantic fixture inventory
        run: bash ci/check-semantic-coverage.sh
